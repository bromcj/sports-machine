name: daily-pipeline
on:
  schedule:
    - cron: '0 14 * * *'
    - cron: '0 22 * * *'
    - cron: '30 0 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python db.py
      - name: pull
        run: |
          if [ "${{ github.event.schedule }}" = "0 14 * * *" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python run_daily.py morning
          else
            python run_daily.py close
          fi
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - run: python export_snapshots.py
      - name: healthcheck
        id: health
        run: python healthcheck.py
        continue-on-error: true
      - name: commit archive and status
        run: |
          git config user.name "machine-bot"
          git config user.email "actions@github.com"
          git add archive/ STATUS.md
          git diff --staged --quiet || git commit -m "archive: $(date -u +%Y-%m-%d-%H%M)"
          git pull --rebase origin main
          git push
      - name: fail loudly if unhealthy
        if: steps.health.outcome == 'failure'
        run: |
          echo "Healthcheck failed — see STATUS.md. Failing run so GitHub emails the owner."
          exit 1
