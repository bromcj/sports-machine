name: daily-pipeline
on:
  schedule:
    # Times are UTC. GitHub cron has no timezone and no DST awareness, so the
    # local times noted below are Eastern DAYLIGHT time, which covers the whole
    # MLB season (Mar-Nov). In winter each one fires an hour earlier locally.
    #
    # BUDGET: the free Odds API tier is 500 credits/month, and one pull costs
    # 1 credit PER IN-SEASON SPORT. All four sports are live in October, so
    # 3 pulls/day = 12/day = ~360/month. A 4th daily pull would be ~480 and a
    # 5th would blow the cap. Do not add a cron without redoing that math.
    #
    # The close pulls are deliberately EARLY, for two reasons.
    #
    # 1. GitHub queues scheduled runs on shared runners and starts them late.
    #    Measured on this repo 2026-09-22: the 14:00 cron fired at 17:58 (3h58m
    #    late) and the 22:40 cron fired at 00:53 (2h13m late). At that second
    #    pull 10 of 14 MLB games had already started, so what came back was
    #    IN-PLAY pricing, not a closing line. Useless as a CLV anchor.
    # 2. Minutes are staggered off the hour. Queue depth spikes at :00, :15,
    #    :30 and :45 because that is when most of GitHub schedules; an odd
    #    minute waits in a far shorter line.
    #
    # A pregame price two hours out is a real market opinion. An in-play price
    # twenty minutes in is not. Early is recoverable; late is worthless.
    - cron: '13 14 * * *'   # 10:13 am ET - opening lines, probables are up
    - cron: '9 21 * * *'    #  5:09 pm ET - ~2h before the 7:05 pm main slate
    - cron: '51 23 * * *'   #  7:51 pm ET - ~2h before 9:40 pm west-coast games
    #
    # Keep the last one BEFORE 00:00 UTC. At 01:20 UTC the runner's calendar day
    # was already tomorrow while the games were still today's, so on Oct 31 ->
    # Nov 1 `active_sports()` would have been asked for the wrong month.
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which pull to run'
        required: true
        default: morning
        type: choice
        options:
          - morning   # opening lines   (costs 1 credit per in-season sport)
          - close     # closing lines   (costs 1 credit per in-season sport)
          - grade     # finals + review (free: ESPN and MLB APIs, no odds pull)
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python db.py
      - name: pull
        # Inputs go through env, never interpolated straight into the script.
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_MODE: ${{ github.event.inputs.mode }}
        run: |
          # An empty SCHEDULE means this was triggered by hand, so honour the
          # dropdown; fall back to morning if it is somehow unset.
          # Match on the HOUR only. This used to compare the whole cron string
          # against '0 14 * * *', which meant changing the morning pull's minute
          # silently turned it into a close pull. The hour is the part that
          # actually identifies which run this is.
          case "$SCHEDULE" in
            *' 14 * * *') MODE=morning ;;
            '')           MODE="${DISPATCH_MODE:-morning}" ;;
            *)            MODE=close   ;;
          esac
          echo "mode=$MODE  (schedule='$SCHEDULE' dispatch='$DISPATCH_MODE')"
          # Later steps need to know which pull this was. A shell variable does
          # not survive the step boundary; GITHUB_ENV does.
          echo "RUN_MODE=$MODE" >> "$GITHUB_ENV"
          python run_daily.py "$MODE"
      # always(): once the odds are stored they are paid for. If anything
      # after the pull raises, the prices must still reach archive/ - the
      # runner and its database are thrown away when the job ends.
      - name: export
        if: always()
        run: python export_snapshots.py
      - name: healthcheck
        id: health
        if: always()
        run: python healthcheck.py
        continue-on-error: true
      - name: commit archive and status
        if: always()
        run: |
          git config user.name "machine-bot"
          git config user.email "actions@github.com"
          git add archive/
          # STATUS.md is absent if healthcheck crashed before writing it;
          # a bare `git add STATUS.md` would then fail this whole step.
          [ -f STATUS.md ] && git add STATUS.md
          git diff --staged --quiet || git commit -m "archive: $(date -u +%Y-%m-%d-%H%M)"
          git pull --rebase origin main
          git push
      - name: fail loudly if unhealthy
        if: steps.health.outcome == 'failure'
        run: |
          echo "Healthcheck failed - see STATUS.md. Failing run so GitHub emails the owner."
          exit 1
