name: tests

# Every push and pull request. No secrets: the suite touches no database and
# no network, so it runs on a bare checkout with no data/ at all - which is
# the point. audit.py checks the live system against live data and cannot run
# here; this is the other half.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.11 is what the collector workflow already runs, so CI matches
          # production. Local development is on 3.14; see requirements.txt.
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q
      # A fresh checkout must be importable with no data/ present. This is
      # what catches a missing dependency - pyarrow was absent from
      # requirements for months and only worked because it arrived as
      # somebody else's transitive install.
      - name: every module imports on a bare checkout
        run: |
          python -c "
          import importlib
          mods = ('db feeds backfill run_daily merge_archive export_snapshots '
                  'healthcheck cronstatus backup audit dashboard '
                  'ingest.odds ingest.scores ingest.mlb ingest.quality ingest.http '
                  'bets.engine bets.log bets.paper '
                  'model.train model.validation model.persist model.predict '
                  'model.market_score '
                  'features.build features.build_training').split()
          for m in mods:
              importlib.import_module(m)
          print(f'{len(mods)} modules import cleanly')
          "
