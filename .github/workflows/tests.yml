name: tests

# Every push and pull request. No secrets: the suite touches no database and
# no network, so it runs on a bare checkout with no data/ at all - which is
# the point. audit.py checks the live system against live data and cannot run
# here; this is the other half.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.11 is what the collector workflow already runs, so CI matches
          # production. Local development is on 3.14; see requirements.txt.
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Includes tests/test_imports.py, which imports every module on this
      # bare checkout (no data/) - what catches a missing dependency - and
      # tests/test_entry_points.py.
      - run: python -m pytest tests/ -q
